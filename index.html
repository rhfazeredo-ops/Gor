<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Terra de Gor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="hero-name">Drakhar · Guerreiro Vark</div>
      <div class="bar"><div id="hp-fill"></div></div>
      <div id="help">WASD mover · Mouse mirar · Clique atacar · Espaço esquivar</div>
    </div>
    <!-- Controles de toque (só aparecem no celular) -->
    <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
    <div id="buttons">
      <button id="btn-dash" class="btn small">⇄</button>
      <button id="btn-attack" class="btn big">⚔</button>
    </div>
    <button id="btn-full" class="btn tiny">⛶</button>
    <div id="rotate">Gire o celular para jogar na horizontal ↻</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
