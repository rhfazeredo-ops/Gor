<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>FX Painter · Terra de Gor</title>
<style>
  :root { --gold:#c9a24a; --bg:#15131b; --panel:#221e2b; --ink:#f3e6c8; --mut:#a89c86; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: system-ui, sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #app { display:flex; height:100%; }
  #stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0; padding:8px; gap:8px; }
  #canvasWrap { position:relative; aspect-ratio:1; height:min(100%, calc(100vh - 110px)); max-width:100%;
    background: repeating-conic-gradient(#1d1a24 0 25%, #191620 0 50%) 0 0/24px 24px; border:2px solid var(--gold); border-radius:6px; }
  #view { width:100%; height:100%; display:block; touch-action:none; }
  #frames { display:flex; gap:6px; overflow-x:auto; max-width:100%; padding-bottom:2px; }
  .fr { flex:none; width:52px; height:52px; border:2px solid #444; border-radius:4px; background:#000; position:relative; }
  .fr canvas { width:100%; height:100%; display:block; }
  .fr.on { border-color:var(--gold); }
  .fr span { position:absolute; left:2px; top:0; font-size:10px; color:var(--mut); }
  #panel { width:300px; max-width:46vw; background:var(--panel); overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; border-left:2px solid #000; }
  h1 { font-size:15px; margin:0; color:var(--gold); }
  h2 { font-size:11px; margin:0 0 4px; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  button, select, input[type=text] { background:#2f2939; color:var(--ink); border:1px solid #4a4256; border-radius:6px; padding:7px 9px; font-size:13px; }
  button.on { background:var(--gold); color:#1a1408; border-color:var(--gold); font-weight:700; }
  button.primary { background:linear-gradient(#d9b45a,#a8822e); color:#1a1408; font-weight:700; border:none; }
  input[type=range] { width:100%; accent-color:var(--gold); }
  .sw { width:30px; height:30px; border-radius:50%; border:2px solid #0008; padding:0; }
  .sw.on { outline:3px solid var(--ink); }
  input[type=color] { width:34px; height:34px; border:none; background:none; padding:0; }
  #preview { width:100%; aspect-ratio:1; border-radius:6px; background:radial-gradient(#4a4552,#2a2633); display:block; }
  #msg { font-size:12px; color:var(--mut); min-height:16px; }
  label { font-size:12px; color:var(--mut); }
  @media (orientation: portrait) { #app { flex-direction:column; } #panel { width:100%; max-width:none; height:45%; border-left:none; border-top:2px solid #000; } #canvasWrap { height:auto; width:min(100%, 50vh); } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="canvasWrap"><canvas id="view"></canvas></div>
    <div id="frames"></div>
  </div>
  <div id="panel">
    <h1>✦ FX Painter · Terra de Gor</h1>

    <div>
      <h2>Pincel</h2>
      <div class="row" id="brushes">
        <button data-b="glow" class="on">✺ Brilho</button>
        <button data-b="solid">● Sólido</button>
        <button data-b="spark">✧ Faísca</button>
        <button data-b="erase">⌫ Borracha</button>
      </div>
    </div>

    <div>
      <h2>Cor</h2>
      <div class="row" id="swatches"></div>
    </div>

    <div>
      <label>Tamanho <b id="sizeV">40</b></label>
      <input type="range" id="size" min="2" max="160" value="40" />
      <label>Força <b id="alphaV">70</b>%</label>
      <input type="range" id="alpha" min="5" max="100" value="70" />
    </div>

    <div>
      <h2>Simetria radial</h2>
      <div class="row" id="sym">
        <button data-s="1" class="on">Off</button><button data-s="2">2</button><button data-s="4">4</button><button data-s="6">6</button><button data-s="8">8</button>
      </div>
    </div>

    <div>
      <h2>Quadros</h2>
      <div class="row">
        <button id="add">+ Novo</button>
        <button id="dup">⧉ Duplicar</button>
        <button id="del">🗑</button>
        <button id="undo">↶</button>
        <button id="clear">Limpar</button>
        <button id="onion" class="on">Casca de cebola</button>
      </div>
    </div>

    <div>
      <h2>Prévia (como no jogo)</h2>
      <canvas id="preview" width="220" height="220"></canvas>
      <label>Velocidade <b id="fpsV">14</b> fps</label>
      <input type="range" id="fps" min="4" max="30" value="14" />
    </div>

    <div>
      <h2>Exportar</h2>
      <input type="text" id="name" value="dalarian-impacto" style="width:100%" placeholder="nome-do-fx" />
      <div class="row" style="margin-top:6px">
        <button class="primary" id="send">➤ Enviar pro Claude</button>
        <button id="save">⤓ Baixar PNG</button>
      </div>
      <div id="msg"></div>
      <img id="out" style="width:100%; margin-top:6px; display:none; background:#000" alt="spritesheet" />
    </div>
  </div>
</div>

<script>
const SIZE = 256;
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const prev = document.getElementById('preview');
const pctx = prev.getContext('2d');
const framesEl = document.getElementById('frames');
const msg = (t) => (document.getElementById('msg').textContent = t);

const st = { brush:'glow', color:'#ffd86b', size:40, alpha:.7, sym:1, onion:true, cur:0, fps:14 };
const PALETTE = ['#ffd86b','#fff6d8','#ffffff','#5aa8ff','#b06bff','#ff7a2a','#ff3b3b','#6bff8a'];

// ---------- quadros ----------
const frames = [];
function newFrame(copyFrom) {
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  if (copyFrom) c.getContext('2d').drawImage(copyFrom.c, 0, 0);
  return { c, undo: [] };
}
for (let i = 0; i < 6; i++) frames.push(newFrame());

function renderStrip() {
  framesEl.innerHTML = '';
  frames.forEach((f, i) => {
    const d = document.createElement('div'); d.className = 'fr' + (i === st.cur ? ' on' : '');
    const t = document.createElement('canvas'); t.width = t.height = 48;
    const tc = t.getContext('2d'); tc.fillStyle = '#000'; tc.fillRect(0,0,48,48);
    tc.globalCompositeOperation = 'lighter'; tc.drawImage(f.c, 0, 0, 48, 48);
    const s = document.createElement('span'); s.textContent = i + 1;
    d.append(t, s); d.onclick = () => { st.cur = i; renderStrip(); draw(); };
    framesEl.append(d);
  });
}

// ---------- desenho ----------
function resize() {
  const r = view.getBoundingClientRect();
  view.width = Math.round(r.width * devicePixelRatio);
  view.height = Math.round(r.height * devicePixelRatio);
  draw();
}
function draw() {
  vctx.clearRect(0, 0, view.width, view.height);
  vctx.fillStyle = 'rgba(10,8,14,.55)'; vctx.fillRect(0, 0, view.width, view.height);
  vctx.globalCompositeOperation = 'lighter';
  if (st.onion && st.cur > 0) { vctx.globalAlpha = .22; vctx.drawImage(frames[st.cur-1].c, 0, 0, view.width, view.height); }
  vctx.globalAlpha = 1; vctx.drawImage(frames[st.cur].c, 0, 0, view.width, view.height);
  vctx.globalCompositeOperation = 'source-over';
  // guias de simetria
  if (st.sym > 1) {
    vctx.strokeStyle = 'rgba(201,162,74,.25)'; vctx.lineWidth = 1;
    const cx = view.width/2, cy = view.height/2, R = view.width;
    for (let k = 0; k < st.sym; k++) { const a = k * Math.PI * 2 / st.sym; vctx.beginPath(); vctx.moveTo(cx, cy); vctx.lineTo(cx + Math.cos(a)*R, cy + Math.sin(a)*R); vctx.stroke(); }
  }
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}
function stampAt(ctx, x, y, size, pressure) {
  const a = st.alpha * pressure;
  if (st.brush === 'erase') {
    ctx.globalCompositeOperation = 'destination-out';
    const g = ctx.createRadialGradient(x, y, 0, x, y, size/2);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, size/2, 0, 7); ctx.fill();
    return;
  }
  ctx.globalCompositeOperation = 'lighter';
  if (st.brush === 'glow') {
    const g = ctx.createRadialGradient(x, y, 0, x, y, size/2);
    g.addColorStop(0, hexA('#ffffff', a*.5)); g.addColorStop(.15, hexA(st.color, a*.6));
    g.addColorStop(.5, hexA(st.color, a*.18)); g.addColorStop(1, hexA(st.color, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, size/2, 0, 7); ctx.fill();
  } else if (st.brush === 'solid') {
    ctx.fillStyle = hexA(st.color, a); ctx.beginPath(); ctx.arc(x, y, size/4, 0, 7); ctx.fill();
  } else if (st.brush === 'spark') {
    for (let i = 0; i < 3; i++) {
      const r = Math.random() * size/2, t = Math.random() * 7;
      const sx = x + Math.cos(t)*r, sy = y + Math.sin(t)*r, s = 1 + Math.random()*Math.max(2, size/14);
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, s*2);
      g.addColorStop(0, hexA('#ffffff', a)); g.addColorStop(.4, hexA(st.color, a*.8)); g.addColorStop(1, hexA(st.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, s*2, 0, 7); ctx.fill();
    }
  }
}
function stamp(x, y, pressure) {
  const ctx = frames[st.cur].c.getContext('2d');
  const c = SIZE/2;
  for (let k = 0; k < st.sym; k++) {
    const ang = k * Math.PI * 2 / st.sym, cos = Math.cos(ang), sin = Math.sin(ang);
    const dx = x - c, dy = y - c;
    stampAt(ctx, c + dx*cos - dy*sin, c + dx*sin + dy*cos, st.size, pressure);
  }
}

let drawing = false, last = null, activeId = null;
function toCanvas(e) {
  const r = view.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * SIZE, y: (e.clientY - r.top) / r.height * SIZE };
}
view.addEventListener('pointerdown', (e) => {
  if (activeId !== null) return;
  activeId = e.pointerId; try { view.setPointerCapture(e.pointerId); } catch (_) {}
  const f = frames[st.cur];
  f.undo.push(f.c.getContext('2d').getImageData(0, 0, SIZE, SIZE)); if (f.undo.length > 25) f.undo.shift();
  drawing = true; last = toCanvas(e);
  stamp(last.x, last.y, e.pointerType === 'pen' ? Math.max(.15, e.pressure) : 1); draw();
});
view.addEventListener('pointermove', (e) => {
  if (!drawing || e.pointerId !== activeId) return;
  const p = toCanvas(e), pr = e.pointerType === 'pen' ? Math.max(.15, e.pressure) : 1;
  const dist = Math.hypot(p.x - last.x, p.y - last.y), step = Math.max(1, st.size * .18);
  for (let d = step; d <= dist; d += step) {
    const t = d / dist; stamp(last.x + (p.x-last.x)*t, last.y + (p.y-last.y)*t, pr);
  }
  if (dist >= step) last = p;
  draw();
});
const end = (e) => { if (e.pointerId !== activeId) return; activeId = null; drawing = false; renderStrip(); autosave(); };
view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end);

// ---------- prévia ----------
let pf = 0, acc = 0, lastT = performance.now();
function loop(t) {
  acc += t - lastT; lastT = t;
  if (acc > 1000 / st.fps) { acc = 0; pf = (pf + 1) % frames.length; }
  pctx.globalCompositeOperation = 'source-over';
  pctx.clearRect(0, 0, prev.width, prev.height);
  // herói-silhueta para dar escala
  pctx.fillStyle = '#34406a'; pctx.beginPath(); pctx.ellipse(110, 125, 14, 26, 0, 0, 7); pctx.fill();
  pctx.fillStyle = '#e8c49a'; pctx.beginPath(); pctx.arc(110, 92, 9, 0, 7); pctx.fill();
  pctx.globalCompositeOperation = 'lighter';
  pctx.drawImage(frames[pf].c, 0, 0, prev.width, prev.height);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- UI ----------
function group(id, attr, key, parse = (v) => v) {
  document.querySelectorAll(`#${id} button`).forEach((b) => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.remove('on'));
    b.classList.add('on'); st[key] = parse(b.dataset[attr]); draw();
  });
}
group('brushes', 'b', 'brush'); group('sym', 's', 'sym', Number);

const sw = document.getElementById('swatches');
PALETTE.forEach((c, i) => {
  const b = document.createElement('button'); b.className = 'sw' + (i === 0 ? ' on' : ''); b.style.background = c;
  b.onclick = () => { st.color = c; sw.querySelectorAll('.sw').forEach((x) => x.classList.remove('on')); b.classList.add('on'); };
  sw.append(b);
});
const picker = document.createElement('input'); picker.type = 'color'; picker.value = st.color;
picker.oninput = () => { st.color = picker.value; sw.querySelectorAll('.sw').forEach((x) => x.classList.remove('on')); };
sw.append(picker);

const bindRange = (id, key, f, label) => { const el = document.getElementById(id); el.oninput = () => { st[key] = f(+el.value); document.getElementById(label).textContent = el.value; }; };
bindRange('size', 'size', (v) => v, 'sizeV');
bindRange('alpha', 'alpha', (v) => v/100, 'alphaV');
bindRange('fps', 'fps', (v) => v, 'fpsV');

document.getElementById('add').onclick = () => { frames.splice(st.cur+1, 0, newFrame()); st.cur++; renderStrip(); draw(); };
document.getElementById('dup').onclick = () => { frames.splice(st.cur+1, 0, newFrame(frames[st.cur])); st.cur++; renderStrip(); draw(); };
document.getElementById('del').onclick = () => { if (frames.length < 2) return; frames.splice(st.cur, 1); st.cur = Math.max(0, st.cur-1); renderStrip(); draw(); autosave(); };
document.getElementById('clear').onclick = () => { const f = frames[st.cur], c = f.c.getContext('2d'); f.undo.push(c.getImageData(0,0,SIZE,SIZE)); c.clearRect(0,0,SIZE,SIZE); renderStrip(); draw(); };
document.getElementById('undo').onclick = () => { const f = frames[st.cur]; const d = f.undo.pop(); if (d) { f.c.getContext('2d').putImageData(d, 0, 0); renderStrip(); draw(); } };
document.getElementById('onion').onclick = (e) => { st.onion = !st.onion; e.target.classList.toggle('on', st.onion); draw(); };

// ---------- exportar ----------
function sheet() {
  const s = document.createElement('canvas'); s.width = SIZE * frames.length; s.height = SIZE;
  const c = s.getContext('2d'); frames.forEach((f, i) => c.drawImage(f.c, i * SIZE, 0));
  return s;
}
const fileName = () => (document.getElementById('name').value.trim().replace(/[^a-z0-9-_]/gi, '-') || 'fx') + `_${frames.length}f_${st.fps}fps.png`;
const toBlob = (c) => new Promise((r) => c.toBlob(r, 'image/png'));
function showOut(c) { const img = document.getElementById('out'); img.src = c.toDataURL('image/png'); img.style.display = 'block'; }

let caps = { assets: null, downloads: null };
if (window.claude && claude.use) {
  claude.use('assets').then((a) => (caps.assets = a)).catch(() => {});
  claude.use('downloads').then((d) => (caps.downloads = d)).catch(() => {});
}

document.getElementById('send').onclick = async () => {
  const s = sheet(); showOut(s);
  if (!caps.assets) { msg('Envio indisponível aqui. Segure a imagem abaixo para salvar e mande no chat.'); return; }
  try {
    msg('Enviando…');
    const blob = await toBlob(s);
    const file = new File([blob], fileName(), { type: 'image/png' });
    const r = await caps.assets.upload(file);
    msg(`✓ Enviado: ${fileName()}. Diga ao Claude "coloca o FX ${document.getElementById('name').value}".`);
  } catch (e) { msg('Falhou o envio: ' + (e.message || e)); }
};
document.getElementById('save').onclick = async () => {
  const s = sheet(); showOut(s);
  const blob = await toBlob(s);
  if (caps.downloads) {
    try { await caps.downloads.save({ filename: fileName(), data: blob }); msg('✓ Salvo.'); return; }
    catch (e) { msg('Download recusado. Segure a imagem abaixo para salvar.'); return; }
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName(); a.click(); msg('✓ Baixado.'); }
  catch (_) { msg('Segure a imagem abaixo para salvar.'); }
};

// ---------- autosave local ----------
function autosave() {
  try { localStorage.setItem('fxpainter', JSON.stringify({ name: document.getElementById('name').value, fps: st.fps, frames: frames.map((f) => f.c.toDataURL()) })); } catch (_) {}
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem('fxpainter') || 'null'); if (!d) return;
    frames.length = 0;
    d.frames.forEach((url) => { const f = newFrame(); const img = new Image(); img.onload = () => { f.c.getContext('2d').drawImage(img, 0, 0); renderStrip(); draw(); }; img.src = url; frames.push(f); });
    if (d.name) document.getElementById('name').value = d.name;
  } catch (_) {}
}
restore();
addEventListener('resize', resize);
renderStrip(); resize();
</script>
</body>
</html>
