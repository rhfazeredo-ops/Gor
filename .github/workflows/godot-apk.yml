name: Gerar APK (Godot 3D)
# A cada envio ao main: exporta a versão Godot para Android e publica em Releases (tag "apk-godot").
on:
  push:
    branches: [main]
    paths: ["godot/**", ".github/workflows/godot-apk.yml", "tools/godot-ci.sh"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk-godot, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with: { path: "~/godot-4.5-stable\n~/.local/share/godot/export_templates", key: godot-4.5-stable }
      - run: tools/godot-ci.sh
      # mesma chave de assinatura entre versões (o APK novo instala por cima do antigo)
      - uses: actions/cache@v4
        with: { path: ~/debug.keystore, key: terra-de-gor-3d-keystore }
      - name: Configurar Android no Godot
        run: |
          [ -f ~/debug.keystore ] || keytool -genkeypair -keystore ~/debug.keystore -alias androiddebugkey -storepass android \
            -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 9999
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres
      - run: |
          cd godot && godot --headless --import || true
          mkdir -p ../dist-godot && godot --headless --export-debug "Android" ../dist-godot/terra-de-gor-3d.apk
          ls -la ../dist-godot
      - name: Publicar em Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-godot --yes --cleanup-tag || true
          gh release create apk-godot dist-godot/terra-de-gor-3d.apk --prerelease --title "Terra de Gor 3D (Godot) — APK de teste" \
            --notes "Versão Godot gerada a partir do commit ${GITHUB_SHA::7}. Instala separada do Terra de Gor 2D."
